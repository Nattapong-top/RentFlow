services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/rooms')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - rentflow

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${RENTFLOW_WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rentflow

networks:
  rentflow:
    driver: bridge